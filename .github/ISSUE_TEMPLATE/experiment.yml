name: Experiment
description: Track a reproducible experiment or evaluation run.
title: "[Experiment]: "
labels: ["type:experiment"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Dataset, config, model, thresholds, seed.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Metrics
      description: Accuracy, precision, recall, F1, FPR, FNR, confusion matrix.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Expected Artifacts
      description: Report files or model checkpoints expected from this experiment.
