seed: 42

data:
  train_path: data/samples/prompt_injection_samples.csv
  eval_paths:
    - data/samples/prompt_injection_samples.csv
    - data/samples/local_eval_extension.csv
  test_size: 0.3
  text_column: text
  label_column: label
  attack_type_column: attack_type

model:
  output_path: models/tfidf_logistic_regression.joblib
  name: tfidf_logistic_regression
  max_features: 5000
  ngram_range: [1, 2]
  class_weight: balanced
  threshold: 0.5
  calibration:
    enabled: true
    min_threshold: 0.1
    max_threshold: 0.95
    step: 0.05
    max_fpr: 0.2
    min_recall: 0.95

ml_policy:
  positive_min_score: 35
  positive_max_score_when_alone: 45

reports:
  output_dir: reports
