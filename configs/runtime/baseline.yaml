data:
  eval_paths:
    - data/samples/prompt_injection_samples.csv
    - data/samples/local_eval_extension.csv
  text_column: text
  label_column: label
  attack_type_column: attack_type

thresholds:
  medium: 35
  high: 65
  critical: 85

rule_weights:
  DIRECT_INJECTION: 70
  SYSTEM_PROMPT_EXTRACTION: 90
  JAILBREAK: 75
  POLICY_BYPASS: 80
  DATA_EXFILTRATION: 85
  TOOL_MISUSE: 75
  ROLE_PLAY_ATTACK: 55
  OBFUSCATED_KOREAN_ATTACK: 65
  MIXED_LANGUAGE_ATTACK: 55
  UNKNOWN_SUSPICIOUS: 45

signal_weights:
  obfuscation_score: 0.25
  sensitive_target_score: 0.25
  instruction_override_score: 0.25
  mixed_language_score: 0.6
  hard_negative_context_score: -0.35

ml_policy:
  positive_min_score: 35

semantic_weights:
  intent_score: 0.75
  hierarchy_score: 0.85
  canary_score: 1.0

actions:
  LOW: ALLOW
  MEDIUM: WARN
  HIGH: REWRITE
  CRITICAL: BLOCK
