seed: 42

data:
  train_path: data/processed/ml_public_verified/train.csv
  dev_path: data/processed/ml_public_verified/dev.csv
  eval_path: data/processed/ml_public_verified/test.csv
  text_column: text
  label_column: label
  attack_type_column: attack_type

model:
  output_path: models/tfidf_logistic_regression_public_verified.joblib
  name: tfidf_logistic_regression_public_verified
  max_features: 30000
  ngram_range: [1, 3]
  analyzer: char_wb
  class_weight: balanced
  threshold: 0.5
  calibration:
    enabled: true
    min_threshold: 0.1
    max_threshold: 0.95
    step: 0.05
    max_fpr: 0.035
    min_recall: 0.97

reports:
  output_dir: reports/ml_public_verified
