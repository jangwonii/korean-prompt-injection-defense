seed: 42

data:
  train_path: data/processed/public_prompt_injection_train.csv
  dev_path: data/processed/public_prompt_injection_dev.csv
  eval_path: data/processed/public_prompt_injection_test.csv
  text_column: text
  label_column: label
  attack_type_column: attack_type

model:
  output_path: models/tfidf_logistic_regression_public.joblib
  name: tfidf_logistic_regression_public
  max_features: 20000
  ngram_range: [1, 2]
  class_weight: balanced
  threshold: 0.5

reports:
  output_dir: reports
  experiment_name: public_ml
