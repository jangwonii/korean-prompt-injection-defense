seed: 42

data:
  dataset_source: Hugging Face neuralchemy/Prompt-injection-dataset core + deepset/prompt-injections + wambosec/prompt-injections + prismdata/guardrail-ko-11class-dataset + leo-bjpark/AdvBench-Korean + local Korean curated samples
  train_path: data/processed/transformer_multi_source_korean_20ep/train.csv
  eval_path: data/processed/transformer_multi_source_korean_20ep/validation.csv
  test_path: data/processed/transformer_multi_source_korean_20ep/test.csv
  test_size: 0.25
  text_column: text
  label_column: label
  attack_type_column: attack_type

model:
  name: distilbert-base-multilingual-cased
  output_dir: models/distilbert-multilingual-prompt-injection-korean-20ep
  max_length: 128
  threshold: 0.5
  freeze_base_model: false

transformer_policy:
  positive_min_score: 65

training:
  require_cuda: true
  learning_rate: 0.00002
  num_train_epochs: 20
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  fp16: true
  weight_decay: 0.01
  logging_steps: 100
  save_strategy: "no"
  save_total_limit: 1
  evaluation_strategy: epoch
  load_best_model_at_end: false

reports:
  output_dir: reports
  experiment_name: transformer_korean_20ep
